<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#120f0d">
  <meta name="description" content="Пиксельная RPG: Свет и Тьма в одном сердце.">
  <meta property="og:title" content="Путь Героя">
  <meta property="og:image" content="icons/icon-512.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="style.css">
  <title>Путь Героя</title>
</head>
<body>
  <!-- Сцена 1280×720, целиком масштабируется под экран -->
  <div id="stage">
    <canvas id="game" width="1280" height="720"></canvas>

    <!-- Подсказка над локацией -->
    <div id="area-name" class="area-name"></div>
    <div id="hud" class="hud" hidden></div>
    <div id="hudbtns" class="hudbtns" hidden>
      <button id="btn-bag" title="Инвентарь (I)" aria-label="Инвентарь"><svg viewBox="0 0 16 16" shape-rendering="crispEdges"><path fill="#1a1410" d="M5 1h6v1h1v2h2v1h1v10H1V5h1V4h2V2h1z"/><path fill="#8a5428" d="M6 2h4v2H6zM2 5h12v9H2z"/><path fill="#a8703a" d="M3 6h10v3H3z"/><path fill="#5a3418" d="M4 10h8v3H4z"/><path fill="#e2b65a" d="M7 8h2v3H7z"/></svg></button>
      <button id="btn-dots" title="Меню (Esc)" aria-label="Меню"><svg viewBox="0 0 16 16" shape-rendering="crispEdges"><path fill="#f4dca0" d="M2 7h3v3H2zM6.5 7h3v3h-3zM11 7h3v3h-3z"/></svg></button>
    </div>
    <div id="toast" class="toast"></div>
    <div id="ach-pop" class="ach-pop"><div id="ach-pop-icon" class="ach-icon"></div><div><div class="ach-pop-label">Достижение получено</div><div id="ach-pop-title" class="ach-title"></div></div></div>
    <div id="flash" class="flash"></div>

    <!-- Диалог: портрет 256×256 слева, имя, текст, выборы -->
    <div id="dialog" class="dialog" hidden>
      <img id="dlg-portrait" class="dlg-portrait" alt="">
      <div class="dlg-box">
        <div id="dlg-name" class="dlg-name"></div>
        <div id="dlg-text" class="dlg-text"></div>
        <div id="dlg-choices" class="dlg-choices"></div>
        <div id="dlg-next" class="dlg-next">▼</div>
      </div>
    </div>

    <!-- Письмо на весь экран: пергамент, цвет чернил, подпись, кнопки (тексты — LETTERS в dialogues.js) -->
    <section id="letter" class="letter" hidden>
      <div class="letter-paper">
        <div id="letter-text" class="letter-text"></div>
        <div id="letter-sign" class="letter-sign"></div>
      </div>
      <div id="letter-btns" class="letter-btns"></div>
    </section>

    <!-- Титул -->
    <section id="title" class="overlay">
      <h1>Путь Героя</h1>
      <p class="sub">Светлая и тёмная магия в одном сердце</p>
      <div class="menu">
        <button id="btn-continue" hidden>Продолжить</button>
        <button id="btn-new">Новая игра</button>
        <button id="btn-saves-title" class="ghost">💾 Сохранения</button>
        <button id="btn-ach" class="ghost">🏆 Достижения</button>
      </div>
      <p class="hint">WASD — движение · Пробел / клик — атака · E — говорить · Q — бутылка · Enter — дальше</p>
    </section>

    <!-- Создание героя -->
    <section id="create" class="overlay" hidden>
      <h2>Создание героя</h2>
      <div class="create-grid">
        <div class="create-preview">
          <canvas id="preview" width="128" height="128"></canvas>
          <div id="preview-note" class="note"></div>
        </div>
        <div class="create-opts">
          <div class="opt-title">Пол</div>
          <div class="opt-row" data-group="gender">
            <button data-value="m" class="on">Парень</button>
            <button data-value="f">Девушка</button>
          </div>
          <div class="opt-title">Оружие</div>
          <div class="opt-row" data-group="weapon">
            <button data-value="sword" class="on">⚔ Меч</button>
            <button data-value="bow">🏹 Лук</button>
            <button data-value="staff">🪄 Посох</button>
          </div>
          <div id="weapon-info" class="note"></div>
          <div class="opt-title">Имя</div>
          <input id="hero-name" maxlength="16" autocomplete="off" placeholder="Как тебя зовут?">
          <div class="menu row">
            <button id="btn-back" class="ghost">Назад</button>
            <button id="btn-start" class="primary">В путь</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Концовка -->
    <section id="ending" class="overlay" hidden>
      <h2 id="ending-title"></h2>
      <p id="ending-text" class="sub ending-text"></p>
      <div id="ending-npcs" class="ending-npcs"></div>
      <div class="menu">
        <button id="btn-ending" class="primary">В главное меню</button>
      </div>
    </section>

    <!-- Слой трещины экрана (этап 8): поверх игры и диалога, под окном ошибки -->
    <canvas id="crackfx" class="crackfx" width="1280" height="720"></canvas>

    <!-- «Ошибка 888»: игра заблокирована после Пути Мести (тексты — LOCK_SCREEN в dialogues.js) -->
    <section id="locked" class="locked" hidden>
      <div class="err-box" role="alertdialog" aria-labelledby="err-title">
        <div class="err-head"><span id="err-head"></span><span class="err-x">✕</span></div>
        <div class="err-body">
          <div class="err-icon">⛔</div>
          <div>
            <div id="err-title" class="err-title"></div>
            <div id="err-text"></div>
            <div id="err-code" class="err-code"></div>
          </div>
        </div>
        <div id="err-progress" class="err-progress" hidden><div id="err-bar" class="err-bar"></div></div>
        <div class="err-actions"><button id="btn-reinstall"></button></div>
      </div>
    </section>

    <!-- Достижения: список (тексты — ACHIEVEMENTS в dialogues.js) -->
    <section id="achievements" class="overlay dim" hidden>
      <h2>Достижения</h2>
      <div id="ach-count" class="note"></div>
      <div id="ach-list" class="ach-board"></div>
      <div id="ach-detail" class="ach-detail"></div>
      <div class="menu"><button id="btn-ach-back">Назад</button></div>
    </section>

    <!-- Сумка, лавка Дариан, дерево Полианны (тексты — ITEMS, SHOP, SKILLS в dialogues.js) -->
    <section id="panel" class="overlay dim" hidden>
      <h2 id="panel-title"></h2>
      <div id="panel-sub" class="note"></div>
      <div id="panel-list" class="ach-list panel-list"></div>
      <div class="menu"><button id="btn-panel-close">Закрыть</button></div>
    </section>

    <!-- Пауза: бордовый баннер -->
    <section id="pause" class="overlay dim" hidden>
      <div class="banner">
        <div class="banner-title">Пауза</div>
        <div class="banner-menu">
          <button id="btn-resume">Продолжить</button>
          <button id="btn-saves-pause">Сохранения</button>
          <button id="btn-ach-pause">Достижения</button>
          <button id="btn-to-title">Выйти</button>
        </div>
      </div>
    </section>

    <!-- Сохранения: 5 ячеек -->
    <section id="saves" class="overlay dim" hidden>
      <h2>Сохранения</h2>
      <div id="saves-list" class="saves-list"></div>
      <div class="menu row"><button id="btn-wipe" class="ghost" hidden>Стереть автосохранение</button><button id="btn-saves-back">Назад</button></div>
    </section>

    <!-- Сенсорное управление (появляется только на телефоне) -->
    <div id="touch" class="touch" hidden>
      <div id="dpad" class="dpad"><b class="du"></b><b class="dl"></b><b class="dr"></b><b class="dd"></b><i></i></div>
      <button id="btn-atk" class="atk" aria-label="Удар"><svg viewBox="0 0 16 16" shape-rendering="crispEdges"><path fill="#1a1410" d="M3 4h9v1h1v1h1v5h-1v2h-1v1H5v-1H4v-1H3v-2H2V6h1z"/><path fill="#f0c8a0" d="M4 5h2v2H4zM6 5h2v2H6zM8 5h2v2H8zM10 5h2v2h-2zM3 7h10v3H3zM4 10h8v2H4zM5 12h6v1H5z"/><path fill="#c89070" d="M4 9h9v1H4zM5 11h7v1H5z"/><path fill="#1a1410" d="M6 5h1v2H6zM8 5h1v2H8zM10 5h1v2h-1z"/></svg></button>
      <button id="btn-act" class="act" aria-label="Взаимодействие">?</button>
      <button id="btn-flask" class="flask" aria-label="Сосуд жизни"><img src="assets/sprites/icon_flask.png" alt=""></button>
      <button id="btn-dash" class="dash-btn" aria-label="Рывок">⇧</button>
    </div>
  </div>

  <script src="dialogues.js"></script>
  <script src="game.js"></script>
  <script>
    // офлайн-режим и обновления (в режиме ?test для автотестов не нужен)
    if ('serviceWorker' in navigator && !location.search.includes('test')) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
